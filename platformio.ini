[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -D NODE_DYP_SENSOR
upload_port = COM21
lib_deps = plerup/EspSoftwareSerial@^8.1.0
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM19
build_flags = 
  -D HUB_RS485_SENSOR
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=23
  -D TFT_MISO=19
  -D TFT_SCLK=18
  -D TFT_CS=4
  -D TFT_DC=13
  -D TFT_RST=5
  -D TOUCH_CS=14
  -D TOUCH_IRQ=27
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=15000000
  -D SPI_TOUCH_FREQUENCY=2500000
lib_deps = 
  bodmer/TFT_eSPI@^2.5.43
  ricmoo/QRCode@^0.0.1
